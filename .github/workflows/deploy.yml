name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Configure deployment URLs
        shell: bash
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"

          if [[ -n "$PAGES_BASE_URL" ]]; then
            base_url="$PAGES_BASE_URL"
          elif [[ "$repository" == "$owner.github.io" ]]; then
            base_url="/"
          else
            base_url="/$repository/"
          fi

          if [[ "$base_url" != */ ]]; then
            base_url="$base_url/"
          fi

          if [[ -n "$PAGES_SITE_URL" ]]; then
            site_url="$PAGES_SITE_URL"
          else
            site_url="https://$owner.github.io${base_url%/}"
          fi

          {
            echo "NUXT_APP_BASE_URL=$base_url"
            echo "NUXT_PUBLIC_SITE_URL=$site_url"
            echo "NUXT_PUBLIC_STATIC_SITE=true"
          } >> "$GITHUB_ENV"

      - name: Generate static site
        run: npm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
